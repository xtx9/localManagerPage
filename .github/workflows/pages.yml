# 파일명: apps/07-localManagerPage.git/.github/workflows/pages.yml
# 공개 저장소 xtx9/localManagerPage.git의 Pages 배포 workflow 원본
# GitHub Pages는 기본적으로 /docs 를 웹 루트로 사용하므로 docs/ 아래 파일만 업로드한다.
name: 공개 웹 페이지 배포

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 공개 페이지 게시
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 공개 저장소 확인
        uses: actions/checkout@v4

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: docs 디렉터리 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
